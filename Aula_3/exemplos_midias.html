<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exemplo de Mídias</title>
</head>
<body>
  <!-- Audio -->
  <div>
    <span>Exemplo Audio</span> <br>
    <audio controls="controls">
      <source src="./sample-5s.mp3" type="audio/mp3">
    </audio>
  </div>

  <!-- Video -->
  <div>
    <span>Exemplo Video</span> <br>
    <video controls="controls">
      <source src="./sample-5s-360p.mp4" type="video/mp4">
    </video>
  </div>

  <!-- iFrame -->
  <div>
    <span>Exemplo I iFrame</span> <br>
    <iframe src="https://cssgradient.io/" title="CSS Gradiente"></iframe>
  </div>
  
  <!-- iFrame -->
  <div>
    <span>Exemplo II iFrame</span> <br>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/PzVihd9BgpI?si=Ts5DR_5NIL2RA0E-" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </div>

  <!-- Imagem -->
  <div>
    <span>Exemplo Imagem</span> <br>
    <img src="https://picsum.photos/200/300" alt="Imagem Aleatoria">
  </div>
</body>
</html>
